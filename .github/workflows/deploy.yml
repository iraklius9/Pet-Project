name: CI and Deploy

on:
  push:
    branches: [ develop, master ]
  workflow_dispatch: { }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///file::memory:?cache=shared
          CELERY_TASK_ALWAYS_EAGER: '1'
        run: |
          pytest -q -rA

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload repo to EC2 (scp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "src/,alembic/,alembic.ini,docker-compose.yml,Dockerfile,entrypoint.sh,healthcheck.sh,nginx/,requirements.txt"
          target: "~/app"
          overwrite: true
          strip_components: 0

      - name: Deploy on EC2 (docker compose up)
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/app
            
            if [ ! -f .env ]; then
              echo "Generating .env on server (no repo dependency)" >&2
              cat > .env << 'EOF'
            POSTGRES_USER=postgres
            POSTGRES_PASSWORD=postgres
            POSTGRES_DB=postgres
            DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
            REDIS_URL=redis://redis:6379/0
            RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
            CACHE_TTL=360
            UVICORN_PORT=8000
            HEALTHCHECK_HOST=127.0.0.1
            HEALTHCHECK_PORT=8000
            HEALTHCHECK_PATH=/
            EOF
            fi
            
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..." >&2
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi
            
            sudo systemctl enable docker || true
            sudo systemctl start docker || true
            
            echo "Deploying with Docker Compose..." >&2
            sudo docker compose pull || true
            sudo docker compose up -d --build --force-recreate
            
            sudo docker compose ps
            echo "Deployment logs (last 20 lines):" >&2
            sudo docker compose logs --tail=20
